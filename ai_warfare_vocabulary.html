<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI WARFARE VOCABULARY MATRIX</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linen: {
              50: '#FDFBF7',
              100: '#FAF0E6',
              200: '#F5EBE0',
              300: '#EFE6DC',
              border: '#D6C7B2',
            },
            navy: {
              900: '#0F172A',
              800: '#1E293B',
              700: '#334155',
              600: '#475569',
            },
            terracotta: {
              DEFAULT: '#C2410C',
              dark: '#9A3412',
              light: '#EA580C',
              soft: '#FFEDD5',
              border: '#FDBA74'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: #FAF0E6;
      color: #0F172A;
      font-family: 'Inter', sans-serif;
    }

    /* Vertical Writing Mode for Category Sidebar Brackets */
    .vertical-text-lr {
      writing-mode: vertical-lr;
      transform: rotate(180deg);
    }

    /* Flashcard 3D flip styling */
    .perspective-1000 {
      perspective: 1000px;
    }
    
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Background subtle tactical grid pattern */
    .bg-grid-pattern {
      background-image: radial-gradient(rgba(194, 65, 12, 0.06) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Minimalist Scrollbars if required on smaller heights */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #FAF0E6;
    }
    ::-webkit-scrollbar-thumb {
      background: #D6C7B2;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C2410C;
    }
  </style>
</head>
<body class="bg-linen-100 min-h-screen text-navy-900 bg-grid-pattern flex flex-col justify-between selection:bg-terracotta selection:text-white p-2 sm:p-4">

  <!-- Main Layout Container -->
  <div class="max-w-[1600px] mx-auto w-full flex-grow flex flex-col justify-between">
    
    <!-- Ultra-compact Header -->
    <header class="mb-2 sm:mb-3 border-b border-linen-border pb-2 flex items-center justify-between gap-2 shrink-0">
      <h1 class="text-lg sm:text-xl md:text-2xl font-black tracking-tight text-navy-900 uppercase font-sans">
        AI WARFARE VOCABULARY MATRIX
      </h1>

      <!-- View Switcher -->
      <div class="flex items-center bg-linen-200 p-0.5 rounded-md border border-linen-border shrink-0 shadow-sm">
        <button id="btn-matrix-view" onclick="switchView('matrix')" class="flex items-center gap-1.5 px-2.5 py-1 text-[11px] font-mono font-bold rounded transition-all duration-200 bg-navy-800 text-white shadow-sm">
          <i class="fa-solid fa-table-cells-large"></i> Matrix View
        </button>
        <button id="btn-flashcard-view" onclick="switchView('flashcards')" class="flex items-center gap-1.5 px-2.5 py-1 text-[11px] font-mono font-bold rounded transition-all duration-200 text-navy-800 hover:bg-linen-300">
          <i class="fa-solid fa-layer-group"></i> Flashcards
        </button>
      </div>
    </header>

    <!-- VIEW 1: MATRIX VIEW (COMPACT 2x2 GRID FOR 1080P FIT) -->
    <main id="matrix-view-container" class="grid grid-cols-1 lg:grid-cols-2 gap-2.5 sm:gap-3 flex-grow my-auto">
      <!-- JavaScript populates 4 compact category sections here -->
    </main>

    <!-- VIEW 2: FLASHCARD STUDY MODE -->
    <main id="flashcard-view-container" class="hidden flex-col items-center justify-center my-auto py-2 space-y-4">
      
      <!-- Counter & Guidance -->
      <div class="w-full max-w-lg flex items-center justify-between text-xs font-mono text-navy-700 px-1">
        <div>CARD <span id="card-current-index" class="text-terracotta font-bold">1</span> OF <span id="card-total-count" class="text-navy-900 font-bold">20</span></div>
        <div class="text-navy-600 hidden sm:block">Space = Flip | Arrows = Next/Prev</div>
      </div>

      <!-- 3D Flip Flashcard -->
      <div id="flashcard-element" onclick="flipCard()" class="w-full max-w-lg h-[260px] sm:h-[290px] perspective-1000 cursor-pointer group">
        <div id="flashcard-inner" class="relative w-full h-full transform-style-3d rounded-xl border border-linen-border bg-linen-50 p-5 shadow-md hover:border-terracotta transition-colors flex flex-col justify-between">
          
          <!-- CARD FRONT -->
          <div class="absolute inset-0 backface-hidden p-6 flex flex-col justify-between rounded-xl bg-linen-50 border border-linen-border shadow-sm">
            <div class="flex items-center justify-between">
              <span id="card-front-category" class="text-[10px] font-mono uppercase tracking-wider px-2 py-0.5 rounded bg-terracotta/10 text-terracotta border border-terracotta/20 font-bold">
                Category
              </span>
              <span class="text-[11px] font-mono text-navy-600 flex items-center gap-1">
                <i class="fa-solid fa-arrows-rotate"></i> Front
              </span>
            </div>

            <div class="text-center my-auto py-2">
              <h2 id="card-front-term" class="text-xl sm:text-2xl font-black text-navy-900 tracking-tight leading-snug">
                Term Name
              </h2>
            </div>

            <div class="flex items-center justify-center text-[11px] text-navy-600 font-mono gap-1">
              <i class="fa-regular fa-hand-pointer text-terracotta animate-bounce"></i> Click or tap to reveal definition
            </div>
          </div>

          <!-- CARD BACK -->
          <div class="absolute inset-0 backface-hidden rotate-y-180 p-5 flex flex-col justify-between rounded-xl bg-linen-200 border border-terracotta/30 shadow-sm overflow-y-auto">
            <div>
              <div class="flex items-center justify-between mb-2.5 border-b border-linen-border pb-1.5">
                <h3 id="card-back-term" class="text-xs sm:text-sm font-extrabold text-navy-900">
                  Term Name
                </h3>
                <span class="text-[10px] font-mono text-terracotta font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-arrows-rotate"></i> Back
                </span>
              </div>

              <p id="card-back-def" class="text-xs sm:text-sm text-navy-900 font-medium leading-relaxed">
                Definition goes here...
              </p>
            </div>

            <div class="pt-2 border-t border-linen-border flex justify-between items-center text-[10px] font-mono text-navy-600">
              <span>TACTICAL REFERENCE</span>
              <span>AI WARFARE</span>
            </div>
          </div>

        </div>
      </div>

      <!-- Controls Row -->
      <div class="w-full max-w-lg flex items-center justify-between gap-2 pt-1">
        <button onclick="prevCard()" class="flex-1 py-2 px-3 bg-navy-800 hover:bg-navy-900 border border-navy-900 rounded-lg font-mono text-xs font-bold text-white transition-colors flex items-center justify-center gap-2 shadow-sm">
          <i class="fa-solid fa-arrow-left"></i> Previous
        </button>
        <button onclick="shuffleCards()" class="px-3.5 py-2 bg-linen-50 hover:bg-linen-200 border border-linen-border rounded-lg font-mono text-xs font-bold text-navy-800 transition-colors shadow-sm" title="Shuffle Deck">
          <i class="fa-solid fa-shuffle text-terracotta"></i>
        </button>
        <button onclick="nextCard()" class="flex-1 py-2 px-3 bg-terracotta hover:bg-terracotta-dark text-white rounded-lg font-mono text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-sm">
          Next <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </main>

  </div>

  <!-- Ultra-compact Footer -->
  <footer class="border-t border-linen-border bg-linen-50/80 py-1.5 text-center text-[10px] font-mono text-navy-600 shrink-0 mt-2">
    <div class="max-w-[1600px] mx-auto px-2 flex justify-between items-center">
      <div>AI WARFARE VOCABULARY MATRIX &copy; 2026</div>
      <div class="flex items-center gap-2">
        <span><i class="fa-solid fa-shield-halved text-terracotta"></i> DEFENSE SPECIFICATION</span>
      </div>
    </div>
  </footer>

  <!-- Application Engine Script -->
  <script>
    // Concise 20-Term Dataset with explicit full parenthetical names for all abbreviations
    const dataset = [
      {
        category: "Strategic Frameworks and Ops Concepts",
        terms: [
          {
            term: "JADC2 (Joint All-Domain Command and Control)",
            definition: "Pentagon network connecting sensors, decision-makers, and shooters across all domains via AI."
          },
          {
            term: "Algorithmic Warfare",
            definition: "Machine learning applied to speed up battlefield management, targeting, and intelligence."
          },
          {
            term: "OODA (Observe-Orient-Decide-Act) Loop Compression",
            definition: "AI accelerating decision cycles to outpace enemy tactical reaction times."
          },
          {
            term: "HITL (Human-in-the-Loop) / HOTL (Human-on-the-Loop)",
            definition: "HITL requires approval to strike; HOTL monitors autonomous action with abort power."
          },
          {
            term: "Centaur Tactics",
            definition: "Teaming human tactical judgment directly with AI computational speed and analytical capacity."
          },
          {
            term: "Mosaic Warfare",
            definition: "Interlocking disaggregated, cheap combat elements dynamically linked into adaptive systems by AI."
          }
        ]
      },
      {
        category: "Systems, Hardware & Swarming",
        terms: [
          {
            term: "Attritable Systems",
            definition: "Low-cost unmanned platforms designed for loss in combat without strategic financial impact."
          },
          {
            term: "Autonomous UAV (Unmanned Aerial Vehicle) Swarm",
            definition: "Drone groups communicating peer-to-peer to coordinate actions without central human control."
          },
          {
            term: "Loitering Munition",
            definition: "Weapon that loiters over an area until detecting a target, then strikes via direct impact."
          },
          {
            term: "CCA (Collaborative Combat Aircraft)",
            definition: "Uncrewed aircraft flying alongside crewed jets for escort, sensing, or strike missions."
          },
          {
            term: "USV (Uncrewed Surface Vessel) / UUV (Uncrewed Underwater Vessel)",
            definition: "Autonomous surface or subsurface platforms for mine countermeasure, reconnaissance, or strike."
          },
          {
            term: "Sensor-to-Shooter Link",
            definition: "Automated pipeline directly linking target detection sensors to offensive weapon platforms."
          }
        ]
      },
      {
        category: "Technical & Data Architecture",
        terms: [
          {
            term: "CV (Computer Vision)",
            definition: "AI algorithms identifying, tracking, and classifying targets from visual, radar, or thermal feeds."
          },
          {
            term: "Edge Computing",
            definition: "Deploying AI inference directly on battlefield hardware instead of remote clouds to cut latency."
          },
          {
            term: "ATR (Automatic Target Recognition)",
            definition: "Algorithms analyzing real-time sensor streams to detect and prioritize targets."
          },
          {
            term: "Data Fusion",
            definition: "Merging disparate intelligence sources into a single unified battlefield picture using machine learning."
          },
          {
            term: "BML (Battle Management Language)",
            definition: "Standardized digital protocol enabling direct machine-to-machine warfighting communication."
          }
        ]
      },
      {
        category: "Countermeasures & Adversarial Tactics",
        terms: [
          {
            term: "Data Poisoning",
            definition: "Injecting malicious data into training sets to degrade AI model accuracy in combat."
          },
          {
            term: "Adversarial Perturbation",
            definition: "Subtle physical or digital modifications engineered to fool computer vision models."
          },
          {
            term: "Cognitive EW (Electronic Warfare)",
            definition: "AI-driven signal processing that adapts in real time to jam unknown frequencies."
          },
          {
            term: "GPS (Global Positioning System)-Denied Navigation",
            definition: "Alternative positioning using vision, terrain, or magnetic mapping when satellite signals fail."
          },
          {
            term: "Spoofing & Counter-AI",
            definition: "Tactics designed to trick autonomous decision engines into false engagements or errors."
          }
        ]
      }
    ];

    // Flattened array for flashcards
    let flatFlashcards = [];
    dataset.forEach(catGroup => {
      catGroup.terms.forEach(t => {
        flatFlashcards.push({
          category: catGroup.category,
          term: t.term,
          definition: t.definition
        });
      });
    });

    // Flashcard State
    let cardIndex = 0;
    let isFlipped = false;
    let currentView = 'matrix';

    // Initialize application
    window.onload = function() {
      renderMatrixView();
      updateFlashcardUI();
      setupKeyboardNav();
    };

    // Render Matrix Layout in 2 Columns with Vertical Category Sidebar Bracket
    function renderMatrixView() {
      const container = document.getElementById('matrix-view-container');
      container.innerHTML = dataset.map((catGroup) => `
        <section class="bg-linen-50 border border-linen-border rounded-lg shadow-sm overflow-hidden flex flex-row h-full">
          
          <!-- NARROW VERTICAL CATEGORY BRACKET SIDEBAR -->
          <div class="w-8 sm:w-9 bg-linen-200 border-r border-linen-border flex items-center justify-center p-1.5 shrink-0 relative">
            <div class="flex items-center justify-center h-full">
              <span class="vertical-text-lr font-mono text-[10px] sm:text-[11px] font-black tracking-wider text-terracotta uppercase whitespace-nowrap">
                ${catGroup.category}
              </span>
            </div>
          </div>

          <!-- COMPACT TERMS & DEFINITIONS LIST -->
          <div class="flex-grow p-2 sm:p-2.5 divide-y divide-linen-border/60 flex flex-col justify-around">
            ${catGroup.terms.map(t => `
              <div class="py-1 sm:py-1.5 first:pt-0 last:pb-0 grid grid-cols-12 gap-1.5 sm:gap-2 items-baseline hover:bg-linen-200/50 px-1.5 rounded transition-colors">
                <div class="col-span-5 sm:col-span-5 font-bold text-navy-900 text-[11px] sm:text-xs font-sans tracking-tight leading-tight">
                  ${t.term}
                </div>
                <div class="col-span-7 sm:col-span-7 text-navy-800 text-[10px] sm:text-[11px] font-medium leading-tight">
                  ${t.definition}
                </div>
              </div>
            `).join('')}
          </div>

        </section>
      `).join('');
    }

    // View Switching Logic
    function switchView(view) {
      currentView = view;
      const matrixContainer = document.getElementById('matrix-view-container');
      const flashcardContainer = document.getElementById('flashcard-view-container');
      const btnMatrix = document.getElementById('btn-matrix-view');
      const btnFlashcard = document.getElementById('btn-flashcard-view');

      if (view === 'matrix') {
        matrixContainer.classList.remove('hidden');
        matrixContainer.classList.add('grid');
        flashcardContainer.classList.add('hidden');
        flashcardContainer.classList.remove('flex');

        btnMatrix.className = "flex items-center gap-1.5 px-2.5 py-1 text-[11px] font-mono font-bold rounded transition-all duration-200 bg-navy-800 text-white shadow-sm";
        btnFlashcard.className = "flex items-center gap-1.5 px-2.5 py-1 text-[11px] font-mono font-bold rounded transition-all duration-200 text-navy-800 hover:bg-linen-300";
      } else {
        matrixContainer.classList.add('hidden');
        matrixContainer.classList.remove('grid');
        flashcardContainer.classList.remove('hidden');
        flashcardContainer.classList.add('flex');

        btnFlashcard.className = "flex items-center gap-1.5 px-2.5 py-1 text-[11px] font-mono font-bold rounded transition-all duration-200 bg-navy-800 text-white shadow-sm";
        btnMatrix.className = "flex items-center gap-1.5 px-2.5 py-1 text-[11px] font-mono font-bold rounded transition-all duration-200 text-navy-800 hover:bg-linen-300";

        resetCardFlip();
        updateFlashcardUI();
      }
    }

    // Flashcard Rendering
    function updateFlashcardUI() {
      const total = flatFlashcards.length;
      document.getElementById('card-total-count').innerText = total;

      if (total === 0) return;

      if (cardIndex >= total) cardIndex = 0;
      if (cardIndex < 0) cardIndex = total - 1;

      document.getElementById('card-current-index').innerText = cardIndex + 1;

      const item = flatFlashcards[cardIndex];
      document.getElementById('card-front-term').innerText = item.term;
      document.getElementById('card-front-category').innerText = item.category;

      document.getElementById('card-back-term').innerText = item.term;
      document.getElementById('card-back-def').innerText = item.definition;
    }

    function flipCard() {
      const inner = document.getElementById('flashcard-inner');
      isFlipped = !isFlipped;
      if (isFlipped) {
        inner.classList.add('rotate-y-180');
      } else {
        inner.classList.remove('rotate-y-180');
      }
    }

    function resetCardFlip() {
      const inner = document.getElementById('flashcard-inner');
      isFlipped = false;
      inner.classList.remove('rotate-y-180');
    }

    function nextCard() {
      if (flatFlashcards.length <= 1) return;
      resetCardFlip();
      setTimeout(() => {
        cardIndex = (cardIndex + 1) % flatFlashcards.length;
        updateFlashcardUI();
      }, 120);
    }

    function prevCard() {
      if (flatFlashcards.length <= 1) return;
      resetCardFlip();
      setTimeout(() => {
        cardIndex = (cardIndex - 1 + flatFlashcards.length) % flatFlashcards.length;
        updateFlashcardUI();
      }, 120);
    }

    function shuffleCards() {
      if (flatFlashcards.length <= 1) return;
      resetCardFlip();
      setTimeout(() => {
        for (let i = flatFlashcards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [flatFlashcards[i], flatFlashcards[j]] = [flatFlashcards[j], flatFlashcards[i]];
        }
        cardIndex = 0;
        updateFlashcardUI();
      }, 120);
    }

    // Keyboard Shortcuts Navigation
    function setupKeyboardNav() {
      document.addEventListener('keydown', (e) => {
        if (currentView === 'flashcards') {
          if (e.code === 'Space') {
            e.preventDefault();
            flipCard();
          } else if (e.code === 'ArrowRight') {
            nextCard();
          } else if (e.code === 'ArrowLeft') {
            prevCard();
          }
        }
      });
    }
  </script>
</body>
</html>
