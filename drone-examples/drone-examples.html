<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone examples</title>
<style>
  :root {
    --linen: #FAF0E6;
    --ink: #24394A;
    --muted: #4F6577;
    --frame: #5B7C8D;
    --accent: #B5654A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--linen);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    height: 100vh;
    max-height: 1080px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 2vh 3vw 2.5vh;
  }
  h1 {
    text-align: center;
    font-size: clamp(26px, 4vh, 44px);
    letter-spacing: 0.04em;
    font-weight: normal;
    padding-bottom: 1.2vh;
    border-bottom: 2px solid var(--accent);
    margin: 0 auto 2vh;
    width: 30%;
    min-width: 280px;
  }
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 2vh 2vw;
    width: 78%;
    margin: 0 auto;
  }
  figure {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #FFFBF6;
    border: 2px solid var(--frame);
    border-radius: 4px;
    padding: 0.6vw;
    box-shadow: 0 3px 10px rgba(36, 57, 74, 0.15);
  }
  .photo {
    position: relative;
    flex: 1;
    min-height: 0;
    border: 1px solid var(--frame);
    background: #EFE4D6;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: clamp(12px, 1.7vh, 17px);
    font-style: italic;
    overflow: hidden;
  }
  .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  figcaption {
    padding-top: 1vh;
    text-align: center;
    font-size: clamp(16px, 2.4vh, 26px);
    color: var(--accent);
    font-weight: bold;
  }
</style>
</head>
<body>
  <h1>Drone examples</h1>
  <main class="grid">

    <figure>
      <div class="photo">
        Place photo-6.jpg beside this file
        <img src="photo-6.jpg" alt="FPV drone" onerror="this.remove()">
      </div>
      <figcaption>FPV drone</figcaption>
    </figure>

    <figure>
      <div class="photo">
        Place photo-7.jpg beside this file
        <img src="photo-7.jpg" alt="Baba Yaga heavy multirotor" onerror="this.remove()">
      </div>
      <figcaption>Baba Yaga heavy multirotor</figcaption>
    </figure>

    <figure>
      <div class="photo">
        Place photo-9.jpg beside this file
        <img src="photo-9.jpg" alt="Baba Yaga with guided munitions" onerror="this.remove()">
      </div>
      <figcaption>Baba Yaga with guided munitions</figcaption>
    </figure>

    <figure>
      <div class="photo">
        Place photo-12.jpg beside this file
        <img src="photo-12.jpg" alt="Switchblade" onerror="this.remove()">
      </div>
      <figcaption>Switchblade</figcaption>
    </figure>

  </main>
</body>
</html>
