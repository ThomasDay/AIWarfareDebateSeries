<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone examples</title>
<style>
  :root {
    --linen: #FAF0E6;
    --ink: #24394A;
    --muted: #4F6577;
    --frame: #5B7C8D;
    --accent: #B5654A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--linen);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    height: 100vh;
    max-height: 1080px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 2vh 3vw 2.5vh;
  }
  h1 {
    text-align: center;
    font-size: clamp(26px, 4vh, 44px);
    letter-spacing: 0.04em;
    font-weight: normal;
    padding-bottom: 1.2vh;
    border-bottom: 2px solid var(--accent);
    margin: 0 auto 2.4vh;
    width: 30%;
    min-width: 280px;
  }
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.8vw;
    width: 94%;
    margin: 0 auto;
  }
  figure {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #FFFBF6;
    border: 2px solid var(--frame);
    border-radius: 4px;
    padding: 0.6vw;
    box-shadow: 0 3px 10px rgba(36, 57, 74, 0.15);
  }
  .photo {
    position: relative;
    flex: 1;
    min-height: 0;
    border: 1px solid var(--frame);
    background: #EFE4D6;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: clamp(12px, 1.7vh, 17px);
    font-style: italic;
    overflow: hidden;
  }
  .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  figcaption {
    padding-top: 1.2vh;
    text-align: center;
  }
  .type {
    font-size: clamp(12px, 1.8vh, 18px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .name {
    font-size: clamp(20px, 3vh, 32px);
    color: var(--accent);
    font-weight: bold;
    margin: 0.3vh 0;
  }
  .attr {
    font-size: clamp(14px, 2vh, 21px);
    color: var(--ink);
  }
</style>
</head>
<body>
  <h1>Drone examples</h1>
  <main class="grid">

    <figure>
      <div class="photo">
        Place photo-16.jpg beside this file
        <img src="photo-16.jpg" alt="MQ-9 Reaper" onerror="this.remove()">
      </div>
      <figcaption>
        <div class="type">MALE armed UAV</div>
        <div class="name">MQ-9 Reaper</div>
        <div class="attr">Long straight wings for many hours of endurance</div>
      </figcaption>
    </figure>

    <figure>
      <div class="photo">
        Place photo-18.jpg beside this file
        <img src="photo-18.jpg" alt="MQ-9 Reaper" onerror="this.remove()">
      </div>
      <figcaption>
        <div class="type">MALE armed UAV</div>
        <div class="name">MQ-9 Reaper</div>
        <div class="attr">Guided munitions carried on external wing hardpoints</div>
      </figcaption>
    </figure>

    <figure>
      <div class="photo">
        Place photo-3.jpg beside this file
        <img src="photo-3.jpg" alt="Shahed-136 / Geran-2" onerror="this.remove()">
      </div>
      <figcaption>
        <div class="type">Long-range one-way attack drone</div>
        <div class="name">Shahed-136 / Geran-2</div>
        <div class="attr">Delta-wing, cruise-missile-like airframe with very long range</div>
      </figcaption>
    </figure>

  </main>
</body>
</html>
